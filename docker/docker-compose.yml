services:
  homog-nora-api:
    container_name: homog-nora-api
    build: .
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    volumes:
      - /home/ubuntu/docker/volumes/udm-fileserver/uploads:/data/uploads:ro
      - /etc/localtime:/etc/localtime:ro   # Sync timezone with host
      - /etc/timezone:/etc/timezone:ro
    networks:
      wireguard:
    restart: always
    environment:
    #comment
      TZ: America/Sao_Paulo
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URL: ${DISCORD_REDIRECT_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ORIGIN: ${ORIGIN}
      DOMAIN: ${DOMAIN}
      PORT: ${PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_TYPE: ${DATABASE_TYPE}
      DATABASE_IP: ${DATABASE_IP}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE: ${DATABASE}
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE}
      SAVE_UNINITIALIZED: ${SAVE_UNINITIALIZED}
      RESAVE: ${RESAVE}
      COOKIE_MAX_AGE: ${COOKIE_MAX_AGE}
      HTTP_ONLY: ${HTTP_ONLY}
      SECURE: ${SECURE}
      SAME_SITE: ${SAME_SITE}
      CREDENTIALS: ${CREDENTIALS}
      CLOUD: ${CLOUD}
networks:
  wireguard:
    external: true
