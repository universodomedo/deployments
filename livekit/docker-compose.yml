services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: always
    command: --config /etc/livekit.yaml
    env_file:
      - .env
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "7880:7880/tcp"                # HTTP/WS signaling (LIVEKIT_URL / LIVEKIT_API_URL)
      - "7881:7881/tcp"                # RTC over TCP (fallback when UDP is blocked)
      - "20000-20099:20000-20099/udp"  # RTC over UDP — the actual audio/video media path
